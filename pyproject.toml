[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "extendable_pydantic"
description = "A lib to define pydantic models extendable at runtime."
authors = [{name = "Laurent Mignon", email = "laurent.mignon@acsone.eu"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "extendable>=1.3.1.dev0",
    "pydantic>=2.5",
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest",
    "coverage[toml]",
    "fastapi>=0.111",
    "httpx",
]
mypy = [
    "mypy>=1.4.1",
]

[project.urls]
Source = "https://github.com/lmignon/extendable-pydantic"

[tool.hatch.version]
# the version is computed from the git tags
source = "vcs"


[tool.hatch.build]
include = ["src/extendable_pydantic"]
directory = "dist"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.coverage.run]
branch = true
source_pkgs = ["extendable_pydantic"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
]

[tool.ruff]
# keep the examples of the documentation as written (e.g. the "#>" outputs)
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/test_forward_refs.py" = ["F821"]

[[tool.mypy.overrides]]
module = "pydantic.main"
implicit_reexport = true

[tool.towncrier]
name = "Extendable Pydantic"
filename = "HISTORY.rst"
directory = "news"
issue_format = "`#{issue} <https://github.com/lmignon/extendable-pydantic/issues/{issue}>`_"
title_format = "{version} ({project_date})"
